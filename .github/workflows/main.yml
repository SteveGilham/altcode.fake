name: CI

on:
  push:
    branches:
    - master
    - feature/*
    - release/*
    - develop/github/*    
  pull_request:
    branches:
    - master

env:
  VERSIONTEMPLATE: 6.2.0.{build}
  DOTNET_ROLL_FORWARD : LatestMajor

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/*.fsproj
          **/packages.lock.json
          **/Directory.Packages.props
    - name: Tools
      run: dotnet tool restore
    - name: Setup
      run: dotnet run --project .\Build\Setup.fsproj

    - name: NuGet login (OIDC → temp API key)
      if: github.ref == 'refs/release/Gendarme'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

    - name: Store API token
      if: github.ref == 'refs/release/Gendarme'
      run: echo "NUGET_API_TOKEN=${{steps.login.outputs.NUGET_API_KEY}}" >> $GITHUB_ENV

    - name: Build
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        NUGET_USER: ${{ secrets.NUGET_USER }}
      run: dotnet run --project .\Build\Build.fsproj
    - uses: actions/upload-artifact@v7
      with:
          name: nupkgs
          path: _Packagin*/*.nupkg
    - uses: actions/upload-artifact@v7
      with:
          name: reportwin
          path: _Reports
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/*.fsproj
          **/packages.lock.json
          **/Directory.Packages.props
    - name: Install mono 
      run: sudo apt-get update && sudo apt-get install -y mono-devel
    - name: Tools
      run: dotnet tool restore
    - name: Setup
      run: dotnet run --project ./Build/Setup.fsproj
    - name: Build
      run: dotnet run --project ./Build/Build.fsproj
    - uses: actions/upload-artifact@v7
      with:
          name: reportnix
          path: _Reports
